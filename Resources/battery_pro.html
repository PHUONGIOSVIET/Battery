<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battery Pro Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000;
            --card-bg: rgba(28, 28, 30, 0.7);
            --accent-color: #32d74b;
            --text-main: #ffffff;
            --text-dim: #8e8e93;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #fff 0%, #8e8e93 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 5px;
        }

        .upload-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--glass-border);
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            display: inline-block;
            background: var(--accent-color);
            color: #000;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(50, 215, 75, 0.3);
        }

        .results {
            width: 100%;
            max-width: 400px;
            display: none;
        }

        .health-circle {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 30px;
        }

        .health-circle svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .health-circle circle {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
        }

        .circle-bg {
            stroke: rgba(255,255,255,0.1);
        }

        .circle-progress {
            stroke: var(--accent-color);
            stroke-dasharray: 502;
            stroke-dashoffset: 502;
            transition: stroke-dashoffset 1.5s ease-in-out;
        }

        .percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Battery Pro</h1>
        <p>Phân tích thông số pin chuyên sâu</p>
    </div>

    <div class="upload-container" id="dropZone">
        <div id="uploadUI">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px; color: var(--accent-color)">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p style="margin-bottom: 20px;">Chọn file Analytics (.ips.ca.synced) để bắt đầu</p>
            <label for="fileInput" class="upload-btn">Chọn File</label>
            <input type="file" id="fileInput" class="file-input" accept="*/*">
        </div>
        <div class="loader" id="loader"></div>
    </div>

    <div class="results" id="results">
        <div class="health-circle">
            <svg viewBox="0 0 180 180">
                <circle class="circle-bg" cx="90" cy="90" r="80"></circle>
                <circle class="circle-progress" id="progressCircle" cx="90" cy="90" r="80"></circle>
            </svg>
            <div class="percentage" id="healthText">0%</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Chu kỳ sạc</span>
                <span class="stat-value" id="cyclesVal">--</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Dung lượng thực</span>
                <span class="stat-value" id="currentVal">--</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Thiết kế</span>
                <span class="stat-value" id="designVal">--</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Nhiệt độ</span>
                <span class="stat-value" id="tempVal">--</span>
            </div>
        </div>
        
        <button onclick="window.location.reload()" class="upload-btn" style="margin-top: 30px; width: 100%; background: #2c2c2e; color: #fff;">Phân tích file khác</button>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadContainer = document.getElementById('dropZone');
        const resultsDiv = document.getElementById('results');
        const uploadUI = document.getElementById('uploadUI');
        const loader = document.getElementById('loader');

        fileInput.addEventListener('change', handleFile);

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            uploadUI.style.display = 'none';
            loader.style.display = 'block';
            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                setTimeout(() => { analyzeData(text); }, 800);
            };
            reader.readAsText(file);
        }

        function analyzeData(text) {
            const cycleMatch = text.match(/last_value_CycleCount":(\d+)/);
            const designMatch = text.match(/last_value_NominalChargeCapacity":(\d+)/);
            const currentMatch = text.match(/last_value_AppleRawMaxCapacity":(\d+)/);
            const tempMatch = text.match(/last_value_AverageTemperature":(\d+)/);

            if (!cycleMatch || !designMatch || !currentMatch) {
                alert("Không tìm thấy dữ liệu pin. Vui lòng chọn đúng file Analytics-*.ips");
                window.location.reload();
                return;
            }

            const cycles = parseInt(cycleMatch[1]);
            const design = parseInt(designMatch[1]);
            const current = parseInt(currentMatch[1]);
            const temp = parseInt(tempMatch[1]);

            let health = Math.round((current / design) * 100);
            if (health > 100) health = 100;

            loader.style.display = 'none';
            uploadContainer.style.display = 'none';
            resultsDiv.style.display = 'block';

            document.getElementById('cyclesVal').innerText = cycles + " lần";
            document.getElementById('currentVal').innerText = current + " mAh";
            document.getElementById('designVal').innerText = design + " mAh";
            document.getElementById('tempVal').innerText = temp + " °C";
            document.getElementById('healthText').innerText = health + "%";

            const circle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 80;
            const offset = circumference - (health / 100) * circumference;
            circle.style.strokeDasharray = circumference;
            circle.style.strokeDashoffset = offset;
        }
    </script>
</body>
</html>
