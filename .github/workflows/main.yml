name: Build Battery IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev socat unzip fakeroot
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          
          # Tải Theos chính
          curl -L https://github.com/theos/theos/archive/master.zip -o theos.zip
          unzip -q theos.zip
          mv theos-master $THEOS
          
          # Xóa sạch thư mục vendor cũ (chứa symlink rỗng)
          rm -rf $THEOS/vendor/dm.pl
          rm -rf $THEOS/vendor/include
          rm -rf $THEOS/vendor/lib
          rm -rf $THEOS/vendor/logos
          
          # Tải vendor submodules
          curl -L https://github.com/theos/dm.pl/archive/master.zip -o dm.zip
          unzip -q dm.zip
          mv dm.pl-master $THEOS/vendor/dm.pl
          
          curl -L https://github.com/theos/headers/archive/master.zip -o headers.zip
          unzip -q headers.zip
          mv headers-master $THEOS/vendor/include
          
          curl -L https://github.com/theos/lib/archive/master.zip -o lib.zip
          unzip -q lib.zip
          mv lib-master $THEOS/vendor/lib
          
          curl -L https://github.com/theos/logos/archive/master.zip -o logos.zip
          unzip -q logos.zip
          mv logos-master $THEOS/vendor/logos
          
          # Tải SDK
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mkdir -p $THEOS/sdks
          mv sdks-master/* $THEOS/sdks/
          
          # Tạo file .git giả (Theos kiểm tra sự tồn tại của file này)
          touch $THEOS/vendor/include/.git
          touch $THEOS/vendor/lib/.git
          touch $THEOS/vendor/dm.pl/.git
          touch $THEOS/vendor/logos/.git
          
          echo "=== Vendor setup complete ==="
          
          # Tải iOS Toolchain cho Linux
          curl -L https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma -o toolchain.tar.lzma
          tar -xf toolchain.tar.lzma -C $THEOS/toolchain
          ls $THEOS/toolchain/linux/iphone/bin/ | head -5
          
      - name: Build Package
        run: |
          make package FINALPACKAGE=1
          
      - name: Convert DEB to IPA
        run: |
          mkdir -p Payload
          ar x packages/*.deb
          tar -xf data.tar.lzma
          cp -r Applications/*.app Payload/
          zip -r BatteryPro.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryPro-IPA
          path: BatteryPro.ipa
