name: Build Battery IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev socat unzip
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          
          # Tải Theos bằng file ZIP để tránh lỗi Git 128
          curl -L https://github.com/theos/theos/archive/master.zip -o theos.zip
          unzip theos.zip
          mv theos-master $THEOS
          
          # Tải SDK (Dùng ZIP cho chắc chắn)
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip sdks.zip
          mkdir -p $THEOS/sdks
          mv sdks-master/* $THEOS/sdks/
          
          # Cài đặt các công cụ bổ sung cần thiết
          cd $THEOS
          git config --global http.postBuffer 524288000
          git submodule update --init --recursive || true
          
      - name: Build Package
        run: |
          make package FINALPACKAGE=1
          
      - name: Convert DEB to IPA
        run: |
          mkdir -p Payload
          ar x packages/*.deb
          tar -xf data.tar.lzma
          cp -r Applications/*.app Payload/
          zip -r BatteryPro.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryPro-IPA
          path: BatteryPro.ipa
